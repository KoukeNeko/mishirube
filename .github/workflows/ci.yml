name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # The version pubspec.yaml is written against. A newer SDK
          # formats differently, so an unpinned runner would reformat
          # the repository on somebody else's machine.
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatted
        run: dart format --set-exit-if-changed lib test
      - name: Analyzed
        run: flutter analyze
      - name: Tested
        run: flutter test

  # Its own job, so an APK comes out even when a check above fails.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # One APK per CPU: most phones take arm64-v8a. Signed with the
      # debug key until the app has a release key (android/app).
      - name: Built
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: mishirube-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
