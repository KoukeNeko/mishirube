name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # The version pubspec.yaml is written against. A newer SDK
          # formats differently, so an unpinned runner would reformat
          # the repository on somebody else's machine.
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatted
        run: dart format --set-exit-if-changed lib test
      - name: Analyzed
        run: flutter analyze
      - name: Tested
        run: flutter test
