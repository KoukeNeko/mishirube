name: Google Play

# An upload is a release to testers, so it is asked for rather than made on
# every push: by hand from the Actions tab, or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Two uploads at once would race for the same version code.
concurrency: playstore

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # Nothing reaches testers that the checks in ci.yml would refuse.
      - name: Analyzed
        run: flutter analyze
      - name: Tested
        run: flutter test
      # The upload key, base64-encoded in a secret. Checked by its shape
      # only, never printed, so a wrong secret fails with a reason rather
      # than inside Gradle.
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || (echo "::error::$name is empty"; exit 1)
          done
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null \
            || (echo "::error::the keystore secret does not open with that password and alias"; exit 1)
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      # Every upload needs a version code above the last; the time does
      # that without a counter to keep, and a re-run gets a new one.
      - name: Bundled
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number="$(date -u +%s)"
      # Play refuses a completed release while the app is still a draft in
      # the Console, so releases stay drafts until the first one is rolled
      # out by hand; then change status to completed.
      - name: Uploaded
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.koukeneko.mishirube
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
      - name: Upload key removed
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
