name: TestFlight

# An upload is a release to testers, so it is asked for rather than made on
# every push: by hand from the Actions tab, or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Two uploads at once would race for the same build number's slot.
concurrency: testflight

jobs:
  upload:
    # The app uses the iOS 27 SDK (heart rate variability as RMSSD), which
    # only Xcode 27 has; GitHub offers it on this image, still a preview.
    runs-on: xcode-27
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # Nothing reaches testers that the checks in ci.yml would refuse.
      - name: Analyzed
        run: flutter analyze
      - name: Tested
        run: flutter test
      # The secret is the .p8 file base64-encoded, as taiga-cli's release
      # workflow takes it. Checked by its shape only, never printed, so a
      # wrong secret fails with a reason rather than inside xcodebuild.
      - name: API key
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          test -n "$KEY_ID" || (echo "::error::APP_STORE_CONNECT_KEY_ID is empty"; exit 1)
          test -n "$ISSUER_ID" || (echo "::error::APP_STORE_CONNECT_ISSUER_ID is empty"; exit 1)
          test -n "$PRIVATE_KEY_BASE64" || (echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is empty"; exit 1)
          KEY_PATH="$RUNNER_TEMP/asc/AuthKey.p8"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s' "$PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH" \
            || ! grep -q -- '-----END PRIVATE KEY-----' "$KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY does not decode to a .p8 key: $(wc -l < "$KEY_PATH") lines, BEGIN line $(grep -c -- '-----BEGIN' "$KEY_PATH"), END line $(grep -c -- '-----END' "$KEY_PATH")"
            exit 1
          fi
      # Every upload needs a build number above the last; the time does
      # that without a counter to keep, and a re-run gets a new one.
      - name: Configured
        run: flutter build ios --release --config-only --build-number="$(date -u +%s)"
      # A fresh runner has no folder for provisioning profiles, and Xcode
      # does not make it: a profile fetched for the Live Activity is then
      # never written, and the archive fails looking for it.
      - name: Profile folders
        run: |
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
      # Signed by Xcode with cloud-managed certificates through the API
      # key, which needs the Admin role: no certificate or profile is kept
      # here, and the app, its Live Activity and its watch app are all
      # provisioned the same way.
      - name: Archived
        run: |
          archive() {
            xcodebuild archive \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/ios/Runner.xcarchive \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY_PATH" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID"
          }
          # Xcode fetches a target's profile during the build, and on a
          # fresh runner packaging can look for the file before it is
          # written (seen for the Live Activity, then the watch app). A
          # second attempt finds what the first one fetched.
          archive || archive
      - name: Uploaded
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
      # A fresh runner has no development certificate, so Xcode makes one
      # for every archive, and the account stops at a handful of them.
      # The ones this runner holds are revoked again, matched by their
      # fingerprint; a certificate made anywhere else is never touched.
      - name: Development certificate revoked
        if: always()
        run: |
          test -f "$KEY_PATH" || exit 0
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'pyjwt[crypto]'
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import base64, hashlib, json, os, re, subprocess, time, urllib.request

          import jwt

          identities = subprocess.run(
              ['security', 'find-identity', '-v', '-p', 'codesigning'],
              capture_output=True, text=True, check=True,
          ).stdout
          made_here = set(re.findall(r'\) ([0-9A-F]{40}) "Apple Development', identities))
          if not made_here:
              print('No development certificate on this runner')
              raise SystemExit

          now = int(time.time())
          token = jwt.encode(
              {'iss': os.environ['ISSUER_ID'], 'iat': now, 'exp': now + 600,
               'aud': 'appstoreconnect-v1'},
              open(os.environ['KEY_PATH']).read(),
              algorithm='ES256',
              headers={'kid': os.environ['KEY_ID']},
          )

          def call(method, path):
              request = urllib.request.Request(
                  'https://api.appstoreconnect.apple.com' + path, method=method,
                  headers={'Authorization': f'Bearer {token}'},
              )
              with urllib.request.urlopen(request) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          listed = call(
              'GET',
              '/v1/certificates?filter%5BcertificateType%5D=DEVELOPMENT,IOS_DEVELOPMENT'
              '&fields%5Bcertificates%5D=certificateContent,name&limit=200',
          )
          for certificate in listed['data']:
              der = base64.b64decode(certificate['attributes']['certificateContent'])
              fingerprint = hashlib.sha1(der).hexdigest().upper()
              if fingerprint in made_here:
                  call('DELETE', f"/v1/certificates/{certificate['id']}")
                  made_here.discard(fingerprint)
                  print(f"Revoked {certificate['attributes']['name']} {fingerprint}")
          if made_here:
              print(f'::warning::Not found to revoke: {sorted(made_here)}')
          EOF
      - name: API key removed
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
