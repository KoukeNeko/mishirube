name: TestFlight

# An upload is a release to testers, so it is asked for rather than made on
# every push: by hand from the Actions tab, or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Two uploads at once would race for the same build number's slot.
concurrency: testflight

jobs:
  upload:
    # The app uses the iOS 27 SDK (heart rate variability as RMSSD), which
    # only Xcode 27 has; GitHub offers it on this image, still a preview.
    runs-on: xcode-27
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # Nothing reaches testers that the checks in ci.yml would refuse.
      - name: Analyzed
        run: flutter analyze
      - name: Tested
        run: flutter test
      # The secret is the .p8 file base64-encoded, as taiga-cli's release
      # workflow takes it. Checked by its shape only, never printed, so a
      # wrong secret fails with a reason rather than inside xcodebuild.
      - name: API key
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          test -n "$KEY_ID" || (echo "::error::APP_STORE_CONNECT_KEY_ID is empty"; exit 1)
          test -n "$ISSUER_ID" || (echo "::error::APP_STORE_CONNECT_ISSUER_ID is empty"; exit 1)
          test -n "$PRIVATE_KEY_BASE64" || (echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is empty"; exit 1)
          KEY_PATH="$RUNNER_TEMP/asc/AuthKey.p8"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s' "$PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH" \
            || ! grep -q -- '-----END PRIVATE KEY-----' "$KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY does not decode to a .p8 key: $(wc -l < "$KEY_PATH") lines, BEGIN line $(grep -c -- '-----BEGIN' "$KEY_PATH"), END line $(grep -c -- '-----END' "$KEY_PATH")"
            exit 1
          fi
      # Every upload needs a build number above the last; the time does
      # that without a counter to keep, and a re-run gets a new one.
      - name: Configured
        run: flutter build ios --release --config-only --build-number="$(date -u +%s)"
      # A fresh runner has no folder for provisioning profiles, and Xcode
      # does not make it: a profile fetched for the Live Activity is then
      # never written, and the archive fails looking for it.
      - name: Profile folders
        run: |
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
      # Signed by Xcode with cloud-managed certificates through the API
      # key, which needs the Admin role: no certificate or profile is kept
      # here, and the app, its Live Activity and its watch app are all
      # provisioned the same way.
      - name: Archived
        run: |
          archive() {
            xcodebuild archive \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/ios/Runner.xcarchive \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY_PATH" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID"
          }
          # Xcode fetches a target's profile during the build, and on a
          # fresh runner packaging can look for the file before it is
          # written (seen for the Live Activity, then the watch app). A
          # second attempt finds what the first one fetched.
          archive || archive
      - name: Uploaded
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
      - name: API key removed
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
